# 针对长条形目标的超参数配置

# 学习率设置
lr0: 0.01                    # 初始学习率
lrf: 0.1                     # 最终学习率因子

# 优化器设置
momentum: 0.937              # SGD动量
weight_decay: 0.0005         # 权重衰减

# 预热设置
warmup_epochs: 3.0           # 预热轮数
warmup_momentum: 0.8         # 预热动量
warmup_bias_lr: 0.1          # 预热偏置学习率

# 损失函数权重
box: 0.05                    # 边界框损失权重
cls: 0.5                     # 分类损失权重
cls_pw: 1.0                  # 分类BCELoss正样本权重
obj: 1.0                     # 目标检测损失权重
obj_pw: 1.0                  # 目标检测BCELoss正样本权重

# IoU阈值 (针对长条形目标调整)
iou_t: 0.1                   # IoU训练阈值 (降低，更宽松)
anchor_t: 3.0                # 锚点阈值 (降低)

# 焦点损失
fl_gamma: 0.0                # 焦点损失gamma

# 数据增强 (针对长条形目标优化)
hsv_h: 0.015                 # HSV色调增强
hsv_s: 0.7                   # HSV饱和度增强
hsv_v: 0.4                   # HSV亮度增强
degrees: 0.0                  # 旋转角度 (设为0，避免破坏长条形)
translate: 0.1                # 平移
scale: 0.5                    # 缩放
shear: 0.0                    # 剪切 (设为0，避免破坏长条形)
perspective: 0.0              # 透视变换 (设为0)
flipud: 0.0                   # 上下翻转 (设为0)
fliplr: 0.5                   # 左右翻转 (保持)
mosaic: 0.0                   # 马赛克增强 (设为0，避免破坏长条形)
mixup: 0.0                    # 混合增强 (设为0)
copy_paste: 0.0               # 复制粘贴 (设为0)

# 说明：
# 1. 针对长条形目标优化
# 2. 关闭可能破坏长条形特征的数据增强
# 3. 降低IoU阈值，提高召回率
# 4. 建议使用autoanchor功能重新计算anchor
